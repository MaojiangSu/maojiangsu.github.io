# Hand-maintained project-page content. Scholar synchronization never writes this file.
# Keys match the stable slugs in data/publications.yml; existing URLs are preserved.
projects:
  flow-matching-rl-sde:
    venue: NeurIPS 2026
    citation_key: su2026flowsde
    summary: When does reinforcement learning with stochastic sampling improve a flow model's deterministic policy?
    abstract: >-
      Reinforcement learning is a promising approach for fine-tuning flow matching models.
      A common strategy uses stochastic SDE inference during training to support exploration,
      then returns to deterministic ODE inference at deployment. We develop a unified framework
      based on diffusion-flow duality that covers both reward fine-tuning of generative models
      and policy optimization with flow policies. We prove that the two inference processes
      induce close terminal distributions when the flow-matching error is small. We further
      give sufficient conditions under which policy improvements during stochastic training
      transfer to deterministic deployment. The analysis explains failure modes caused by weak
      pretraining or excessive drift during RL. Experiments on synthetic and continuous-control
      tasks validate the theory and evaluate the resulting algorithms.
    highlights:
      - title: A unified RL framework
        text: Connect reward fine-tuning and flow-policy optimization through stochastic inference, recovering existing methods and motivating new algorithms.
      - title: A deployment guarantee
        text: Bound the difference between SDE and ODE terminal distributions and identify when a training-time policy improvement survives deterministic deployment.
      - title: Theory meets control
        text: Use synthetic experiments and continuous-control tasks to test the theory and the proposed flow-policy optimization algorithms.

  likelihood-free-generative-policy-optimization:
    venue: NeurIPS 2026
    citation_key: su2026lfgpo
    summary: Improve diffusion and flow policies without evaluating intractable action likelihoods.
    abstract: >-
      Diffusion and flow models offer expressive policies for continuous control, but their
      action likelihoods are generally intractable. This makes many standard policy optimization
      methods difficult to apply. We introduce Likelihood-Free Generative Policy Optimization
      (LFGPO), a two-stage framework that separates policy improvement from generative model
      training. A lightweight ratio model first captures the desired policy update. A conditional
      drift-matching objective then transfers that update to a diffusion or flow policy.
      The framework accommodates update rules including PPO and GRPO. Our analysis relates the
      target policy to the Doob h-transform, proves gradient equivalence between the practical
      and ideal drift-matching objectives, and establishes a minimum-control-energy interpretation
      in the diffusion setting. Experiments on MuJoCo continuous-control tasks evaluate both
      diffusion and flow implementations.
    highlights:
      - title: Separate improvement from fitting
        text: Learn a likelihood-ratio model for the policy update, then distill the update into an expressive generative policy.
      - title: Diffusion and flow policies
        text: Use conditional drift matching to support multiple policy classes and update rules without exact action-likelihood evaluation.
      - title: An optimal-control view
        text: Characterize the target through the Doob h-transform and connect the diffusion objective to minimum-energy control under the specified endpoint constraints.

  scholar-kc-bzdyksqc:
    venue: ICML 2026
    citation_key: pmlr-v306-pi26a
    citation:
      source_name: PMLR
      source_url: https://proceedings.mlr.press/v306/pi26a.html
      bibtex: |
        @InProceedings{pmlr-v306-pi26a,
          title = 	 {Learning Manifold Data with Flow Matching},
          author =       {Pi, Sophia and Lu, Mingcheng and Su, Maojiang and Wu, Weimin and Hu, Jerry Yao-Chieh and Liu, Han},
          booktitle = 	 {Proceedings of the 43rd International Conference on Machine Learning},
          pages = 	 {98666--98695},
          year = 	 {2026},
          editor = 	 {Zhang, Tong and Dudik, Miroslav and Jaggi, Martin and Agarwal, Alekh and Li, Sharon and Schuurmans, Dale and Zhu, Jerry and Berkenkamp, Felix and Dong, Hanze and Bietti, Alberto},
          volume = 	 {306},
          series = 	 {Proceedings of Machine Learning Research},
          month = 	 {06--11 Jul},
          publisher =    {PMLR},
          pdf = 	 {https://raw.githubusercontent.com/mlresearch/v306/main/assets/pi26a/pi26a.pdf},
          url = 	 {https://proceedings.mlr.press/v306/pi26a.html},
          abstract = 	 {We study flow-matching transformers when data lie on a low-dimensional manifold. Our key insight is a flow decomposition that splits motion along the manifold from motion off the manifold. The scheme works for first and higher-order flow matching and ties model complexity to the intrinsic manifold dimension. Building on these, we establish tighter sample-complexity bounds for velocity approximation, velocity estimation, and distribution estimation. Our results show how flow-matching transformers escape the curse of dimensionality by utilizing intrinsic data structure.}
        }
    summary: Flow-matching theory that follows the data's intrinsic dimension, rather than the ambient space.
    abstract: >-
      We study the statistical efficiency of flow-matching transformers when data lie in a
      low-dimensional linear subspace. The key idea is to decompose the velocity field into
      motion along the data subspace and motion toward it. This separates the nonlinear
      learning problem from a simple normal contraction. We derive guarantees for velocity
      approximation, velocity estimation, and distribution estimation whose statistical rates
      depend on the intrinsic dimension. The decomposition also extends to higher-order flow
      matching. These results explain how a suitable model structure can exploit low-dimensional
      data and avoid the ambient-dimensional rates of a full-space analysis.
    links:
      - label: Paper
        url: https://openreview.net/pdf?id=Q97luuOnqy
      - label: OpenReview
        url: https://openreview.net/forum?id=Q97luuOnqy
    highlights:
      - title: Separate tangent and normal motion
        text: Decompose the velocity field under a linear latent-subspace assumption to isolate the part of the dynamics that must be learned.
      - title: Intrinsic-dimension rates
        text: Establish approximation, estimation, and Wasserstein distribution guarantees that reflect low-dimensional data structure.
      - title: Beyond first-order flows
        text: Extend the velocity decomposition to higher-order flow matching and obtain corresponding intrinsic-dimension statistical rates.

  scholar-yowf2qjgphmc:
    venue: ICML 2026
    citation_key: pmlr-v306-hu26h
    citation:
      source_name: PMLR
      source_url: https://proceedings.mlr.press/v306/hu26h.html
      bibtex: |
        @InProceedings{pmlr-v306-hu26h,
          title = 	 {In-Context Universal Approximation, Compositional Generalization, and Algorithm Emulation},
          author =       {Hu, Jerry Yao-Chieh and Chen, Hong-Yu and Lin, Po-Chiao and Su, Maojiang and Liu, Han},
          booktitle = 	 {Proceedings of the 43rd International Conference on Machine Learning},
          pages = 	 {44705--44798},
          year = 	 {2026},
          editor = 	 {Zhang, Tong and Dudik, Miroslav and Jaggi, Martin and Agarwal, Alekh and Li, Sharon and Schuurmans, Dale and Zhu, Jerry and Berkenkamp, Felix and Dong, Hanze and Bietti, Alberto},
          volume = 	 {306},
          series = 	 {Proceedings of Machine Learning Research},
          month = 	 {06--11 Jul},
          publisher =    {PMLR},
          pdf = 	 {https://raw.githubusercontent.com/mlresearch/v306/main/assets/hu26h/hu26h.pdf},
          url = 	 {https://proceedings.mlr.press/v306/hu26h.html},
          abstract = 	 {We study in-context universal approximation and compositional generalization in frozen softmax Transformers as prompt-programmable computation. We prove in-context universality via in-context emulation: a fixed-weight Transformer emulates target computations specified by the prompt and hence approximates a broad class of continuous sequence-to-sequence functions. Building on this view, we establish one-pass and multi-pass composition theorems: prompts associated with simple “subprograms” let the same fixed Transformer execute their composition and thereby synthesize more complex programs on-the-fly. These results support a principled view of prompts as programs and fixed-weight Transformers as program interpreters. They also provide concrete mechanisms by which GPT-style models execute and assemble algorithms in context. Please see arXiv for the full version.}
        }
    summary: Prompts act as programs; a fixed-weight transformer executes and composes them.
    abstract: >-
      We study in-context universal approximation and compositional generalization in softmax
      transformers with fixed weights. A prompt specifies the computation to perform, while
      the transformer serves as an interpreter. We prove that a fixed-weight transformer can
      approximate a broad class of continuous sequence-to-sequence functions through this
      in-context emulation mechanism. We also establish composition results: prompts for simpler
      computations can be combined so that the same transformer executes their composition.
      The results give a constructive perspective on how a single model can carry out different
      algorithms and assemble more complex computations without task-specific weight updates.
    links:
      - label: Paper
        url: https://openreview.net/pdf?id=qOCTnhx4il
      - label: OpenReview
        url: https://openreview.net/forum?id=qOCTnhx4il
    highlights:
      - title: In-context universality
        text: Construct a fixed-weight softmax transformer that approximates a broad class of continuous sequence-to-sequence functions using task-specific prompts.
      - title: Compositional generalization
        text: Show how prompts for simpler computations allow the same model to execute their composition.
      - title: A program-interpreter view
        text: Separate the task description from the computation engine, offering a theoretical account of prompt-programmable behavior.

