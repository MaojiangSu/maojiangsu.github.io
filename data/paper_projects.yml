        text: Introduce GERM-T, a small-step continual-learning strategy that reduces the need to pretrain again from scratch.

  paper1:
    title: Computational Limits of Low-Rank Adaptation (LoRA) Fine-Tuning for Transformer Models
    venue: ICLR 2025
    citation_key: hu2025loralimits
    summary: When can low-rank fine-tuning be computed efficiently, and where are its limits?
    links:
      - label: Paper
        file: theory_of_lora_iclr_2025.pdf
      - label: arXiv
        url: https://arxiv.org/abs/2406.03136
      - label: Proceedings
        url: https://proceedings.iclr.cc/paper_files/paper/2025/hash/12143893d9d37c3569dda800b95cabd9-Abstract-Conference.html
    highlights:
      - title: A computational phase transition
        text: Identify a norm-dependent boundary between efficient approximation and conditional hardness under the Strong Exponential Time Hypothesis.
      - title: Almost-linear algorithms
        text: Exploit hierarchical low-rank structure to approximate the gradients involved in LoRA fine-tuning.
      - title: Partial and full adaptation
        text: Analyze different choices of trainable attention projections within the same computational framework.
