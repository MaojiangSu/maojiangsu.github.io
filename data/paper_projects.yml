  paper2:
    title: In-Context Deep Learning via Transformer Models
    venue: ICML 2025
    citation_key: pmlr-v267-wu25aa
    citation:
      source_name: PMLR
      source_url: https://proceedings.mlr.press/v267/wu25aa.html
      bibtex: |
        @InProceedings{pmlr-v267-wu25aa,
          title = 	 {In-Context Deep Learning via Transformer Models},
          author =       {Wu, Weimin and Su, Maojiang and Hu, Jerry Yao-Chieh and Song, Zhao and Liu, Han},
          booktitle = 	 {Proceedings of the 42nd International Conference on Machine Learning},
          pages = 	 {67670--67718},
          year = 	 {2025},
          editor = 	 {Singh, Aarti and Fazel, Maryam and Hsu, Daniel and Lacoste-Julien, Simon and Berkenkamp, Felix and Maharaj, Tegan and Wagstaff, Kiri and Zhu, Jerry},
          volume = 	 {267},
          series = 	 {Proceedings of Machine Learning Research},
          month = 	 {13--19 Jul},
          publisher =    {PMLR},
          pdf = 	 {https://raw.githubusercontent.com/mlresearch/v267/main/assets/wu25aa/wu25aa.pdf},
          url = 	 {https://proceedings.mlr.press/v267/wu25aa.html},
          abstract = 	 {We investigate the transformer’s capability for in-context learning (ICL) to simulate the training process of deep models. Our key contribution is providing a positive example of using a transformer to train a deep neural network by gradient descent in an implicit fashion via ICL. Specifically, we provide an explicit construction of a $(2N+4)L$-layer transformer capable of simulating $L$ gradient descent steps of an $N$-layer ReLU network through ICL. We also give the theoretical guarantees for the approximation within any given error and the convergence of the ICL gradient descent. Additionally, we extend our analysis to the more practical setting using Softmax-based transformers. We validate our findings on synthetic datasets for 3-layer, 4-layer, and 6-layer neural networks. The results show that ICL performance matches that of direct training.}
        }
    summary: A transformer can train a deep neural network in context without changing its own weights.
    abstract: >-
      We investigate whether a transformer can simulate the training of a deep model through
      in-context learning. We give an explicit construction of a transformer that carries out
      gradient descent on a multilayer ReLU network while keeping its own weights fixed.
      The analysis provides approximation and convergence guarantees and extends to
      softmax-based transformers. Experiments with three-, four-, and six-layer neural networks
      on synthetic datasets compare in-context training with direct gradient-based training.
      This establishes a constructive example of learning a deep model entirely through context.
    links:
      - label: Paper
        file: 6952_In_Context_Deep_Learning_.pdf
      - label: Proceedings
        url: https://proceedings.mlr.press/v267/wu25aa.html
      - label: Poster
        file: icl_deep_icml2025_poster.pdf
    poster:
      image: icl_deep_icml2025_poster.png
      alt: Conference poster presenting the in-context deep-learning construction and experiments.
    highlights:
      - title: Learning inside a forward pass
        text: Explicitly construct a transformer that simulates gradient-descent training of a deep ReLU network from information supplied in context.
      - title: Provable approximation
        text: Establish approximation and convergence guarantees, including an extension to softmax-based transformers.
      - title: Synthetic validation
        text: Compare in-context learning with direct training for deep networks of several depths.

  paper3:
    venue: ICML 2025
    citation_key: pmlr-v267-luo25g
    citation:
      source_name: PMLR
      source_url: https://proceedings.mlr.press/v267/luo25g.html
      bibtex: |
        @InProceedings{pmlr-v267-luo25g,
          title = 	 {Fast and Low-Cost Genomic Foundation Models via Outlier Removal},
          author =       {Luo, Haozheng and Qiu, Chenghao and Su, Maojiang and Zhou, Zhihan and Mehta, Zoe and Ye, Guo and Hu, Jerry Yao-Chieh and Liu, Han},
          booktitle = 	 {Proceedings of the 42nd International Conference on Machine Learning},
          pages = 	 {41254--41289},
          year = 	 {2025},
          editor = 	 {Singh, Aarti and Fazel, Maryam and Hsu, Daniel and Lacoste-Julien, Simon and Berkenkamp, Felix and Maharaj, Tegan and Wagstaff, Kiri and Zhu, Jerry},
          volume = 	 {267},
          series = 	 {Proceedings of Machine Learning Research},
          month = 	 {13--19 Jul},
          publisher =    {PMLR},
          pdf = 	 {https://raw.githubusercontent.com/mlresearch/v267/main/assets/luo25g/luo25g.pdf},
          url = 	 {https://proceedings.mlr.press/v267/luo25g.html},
          abstract = 	 {To address the challenge of scarce computational resources in genomic modeling, we introduce GERM, a genomic foundation model optimized for accessibility and adaptability. GERM improves upon models like DNABERT-2 by eliminating outliers that hinder low-rank adaptation and post-training quantization, enhancing both efficiency and robustness. We replace the vanilla attention layer with an outlier-free mechanism inspired by associative memory models. By removing outliers during both pre-training and fine-tuning, this approach accelerates adaptation, reduces computational costs, and enhances quantization robustness within acceptable loss margins. Additionally, we propose GERM-T, a strategy that employs small-step continual learning within the outlier-free framework, leveraging original checkpoints to avoid retraining from scratch. Empirically, GERM improves fine-tuning performance by 37.98% and quantization by 64.34% over the baseline model. It also reduces average kurtosis by 92.14% and maximum infinity norm by 82.77%. Compared to leading methods, GERM consistently delivers superior performance, offering a practical solution for genomic modeling in resource-constrained settings.}
        }
    summary: Remove outliers to make genomic foundation models easier to adapt and quantize.
    links:
      - label: Paper
        file: 832_Fast_and_Low_Cost_Genomic_.pdf
      - label: Code
        url: https://github.com/MAGICS-LAB/GERM
      - label: Proceedings
        url: https://proceedings.mlr.press/v267/luo25g.html
      - label: Poster
        file: _GERM__2025ICML_poster.pdf
    poster:
      image: _GERM__2025ICML_poster.png
      alt: GERM conference poster describing outlier removal, efficient adaptation, and quantization results.
    highlights:
      - title: Outlier-free model design
        text: Replace standard attention with an outlier-free mechanism to improve the behavior of genomic foundation models.
      - title: Efficient adaptation and quantization
        text: Evaluate how outlier removal improves low-rank fine-tuning and makes low-precision deployment more robust.
      - title: Reuse existing checkpoints
        text: Introduce GERM-T, a small-step continual-learning strategy that reduces the need to pretrain again from scratch.

