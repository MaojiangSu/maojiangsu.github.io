    cover:
      image: paper1.png
      alt: "Computational limits of low-rank adaptation (lora) for transformer-based models"
    edit_post:
      url: "https://arxiv.org/abs/2406.03136"
      text: "The International Conference on Learning Representations 2025"
    downloads:
      - label: Paper
        file: theory_of_lora_iclr_2025.pdf
    abstract: >-
      We study the computational limits of Low-Rank Adaptation (LoRA) update for finetuning
      transformer-based models using fine-grained complexity theory. Our key observation is that
      the existence of low-rank decompositions within the gradient computation of LoRA adaptation
      leads to possible algorithmic speedup. This allows us to (i) identify a phase transition
      behavior and (ii) prove the existence of nearly linear algorithms by controlling the LoRA
      update computation term by term, assuming the Strong Exponential Time Hypothesis (SETH).
    figure:
      title: "Figure: Computational limits of low-rank adaptation (lora) for transformer-based models"
      image: paper1.png

