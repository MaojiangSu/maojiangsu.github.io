  - slug: paper3
    title: "Fast and Low-Cost Genomic Foundation Models via Outlier Removal"
    date: "2025-05-13"
    venue: "The 42nd International Conference on Machine Learning 2025"
    tags:
      - Genomics
      - Foundation Models
      - Quantization
      - LoRA
      - Outlier Removal
    authors:
      - Haozheng Luo
      - Chenghao Qiu
      - Maojiang Su
      - Zhihan Zhou
      - Zoe Mehta
      - Guo Ye
      - Jerry Yao-Chieh Hu
      - Han Liu
    description: >-
      This paper proposes GERM, an efficient genomic foundation model leveraging outlier removal
      techniques for low-cost fine-tuning and robust quantization. Published in the 42nd
      International Conference on Machine Learning (ICML), 2025.
    summary: >-
      GERM removes outliers to improve genomic model efficiency, enabling quantization and LoRA
      fine-tuning with minimal degradation.
    cover:
      image: _GERM__2025ICML_poster.png
      alt: "GERM: Fast and Low-Cost Genomic Foundation Models"
    edit_post:
      url: "https://github.com/MAGICS-LAB/GERM"
      text: "Published in the 42nd International Conference on Machine Learning (ICML), 2025."
    downloads:
      - label: Paper (PDF)
        file: 832_Fast_and_Low_Cost_Genomic_.pdf
    abstract: >-
      To address the challenge of scarce computational resources in genomic modeling, this paper
      introduces **GERM**, a genomic foundation model with strong compression performance and fast
      adaptability. GERM eliminates outliers during both pretraining and fine-tuning stages,
      enhancing both LoRA-based low-rank adaptation and post-training quantization robustness.
      Additionally, a continual learning variant named **GERM-T** further reduces retraining costs
      by applying outlier removal in small steps. Compared to DNABERT-2, GERM improves fine-tuning
      performance by **37.98%**, quantization robustness by **64.34%**, and reduces average kurtosis
      by **92.14%**. These results demonstrate GERM's practical effectiveness for genomic tasks in
      resource-constrained environments.
    figure:
      title: Figure
      image: _GERM__2025ICML_poster.png

  - slug: paper4
    title: "High-Order Flow Matching: Unified Framework and Sharp Statistical Rates"
    date: "2025-09-18"
    venue: "Neural Information Processing Systems 2025"
    tags:
      - Flow Matching
      - Transformers
      - Statistical Rates
      - High-Order Dynamics
    authors:
      - Maojiang Su
      - Jerry Yao-Chieh Hu
      - Yi-Chen Lee
      - Ning Zhu
      - Jui-Hui Chung
      - Shang Wu
      - Zhao Song
      - Minshuo Chen
      - Han Liu
    description: >-
      We present a unified framework for standard and high-order flow matching that incorporates
      trajectory derivatives up to an arbitrary order $K$. Our key innovation is establishing the
      marginalization technique that converts the intractable $K$-order loss into a simple
      conditional regression with exact gradients and identifying the consistency constraint. We
      establish sharp statistical rates of the $K$-order flow matching implemented with
      transformer networks.
    cover:
      image: paper4.jpeg
      alt: "High-Order Flow Matching: Unified Framework and Sharp Statistical Rates"
    edit_post:
      text: "Neural Information Processing Systems 2025"
    extra_front_matter:
      conference: "Neural Information Processing Systems (NeurIPS) 2025"
      pdf: "https://maojiangsu.github.io/papers/paper4/high_order_FM_ver_prelim.pdf"
      pdf_file: high_order_FM_ver_prelim.pdf
    downloads:
      - label: Paper
        file: high_order_FM_ver_prelim.pdf
    abstract: >-
      Flow matching is an emerging generative modeling framework that learns continuous-time
      dynamics to map noise into data. To enhance expressiveness and sampling efficiency, recent
      works have explored incorporating high-order trajectory information. Despite the empirical
      success, a holistic theoretical foundation is still lacking. We present a unified framework
      for standard and high-order flow matching that incorporates trajectory derivatives up to an
      arbitrary order $K$. Our key innovation is establishing the marginalization technique that
      converts the intractable $K$-order loss into a simple conditional regression with exact
      gradients and identifying the consistency constraint. We establish sharp statistical rates
      of the $K$-order flow matching implemented with transformer networks. With $n$ samples, flow
      matching estimates nonparametric distributions at a rate
      $\tilde{O}(n^{-\Theta(1/d)})$, matching minimax lower bounds up to logarithmic factors.
    figure:
      title: "Figure: High-Order Flow Matching"
      image: paper4.jpeg
