name: Sync Google Scholar publications

on:
  schedule:
    - cron: "23 14 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: scholar-publication-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Fetch Google Scholar profile
        id: scholar
        run: python scripts/sync_scholar.py

      - name: Render publication pages
        if: steps.scholar.outputs.changed == 'true'
        run: python scripts/render_papers.py

      - name: Commit publication update
        id: commit
        if: steps.scholar.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/publications.scholar.yml content/papers
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync Google Scholar publications"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Trigger Hugo deployment
        if: steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hugo.yml --ref main

      - name: Notify repository owner
        if: steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_COUNT: ${{ steps.scholar.outputs.new_count }}
          NEW_TITLES: ${{ steps.scholar.outputs.new_titles }}
          PROFILE_URL: ${{ steps.scholar.outputs.profile_url }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          notification_file="${RUNNER_TEMP}/scholar-update.md"
          {
            echo "Google Scholar synchronization updated the publication website."
            echo
            if [[ "$NEW_COUNT" != "0" ]]; then
              echo "New publications detected:"
              echo
              printf '%s\n' "$NEW_TITLES"
            else
              echo "Scholar metadata changed for existing publications."
            fi
            echo
            echo "- Scholar profile: ${PROFILE_URL}"
            echo "- Commit: https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}"
            echo "- Deployment: dispatched after this commit"
          } > "$notification_file"
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Publication website updated from Google Scholar" \
            --body-file "$notification_file" \
            --assignee "$REPOSITORY_OWNER"
